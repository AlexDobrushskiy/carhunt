[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carhunt"
version = "0.1.0"
description = "Find, vet, contact and buy a used car with Claude Code agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# core runtime deps are always installed: every CLI group needs config + secrets
dependencies = ["pyyaml>=6", "jsonschema>=4.20", "requests>=2.31"]

[project.optional-dependencies]
core = ["pyyaml>=6", "jsonschema>=4.20", "requests>=2.31"]
# agent browsers: CDP, cookie jar crypto, slider/grid captcha vision
browsers = ["playwright>=1.47", "websocket-client>=1.8", "cryptography>=42", "numpy>=1.26", "opencv-python-headless>=4.9"]
# optional browser routes: camoufox (Imperva sites behind a country proxy), curl_cffi (TLS-fingerprinted plain HTTP)
stealth = ["camoufox>=0.4", "curl_cffi>=0.7"]
# local image-grid captcha model; heavy (torch), so not in `all`: bootstrap --extras all,captcha
captcha = ["pillow>=10", "torch>=2.3", "transformers>=4.44", "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'", "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]
sites = ["cryptography>=42"]
discover = []
contact = []
vet = ["markdown>=3.5"]
dev = ["pytest>=8", "pytest-cov", "ruff", "jsonschema>=4.20", "pyyaml>=6"]
all = ["carhunt[core,browsers,stealth,sites,discover,contact,vet,dev]"]

[project.scripts]
carhunt = "carhunt.cli:main"

[tool.setuptools.packages.find]
include = ["carhunt*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]
"carhunt.vet" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "carhunt"]
addopts = "-q --import-mode=importlib"
markers = ["macos: needs macOS (Keychain)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
