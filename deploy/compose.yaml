# carhunt: cardb (API) + web (phone UI) on this machine. Ports are published on 127.0.0.1 only.
# Usage and remote access: deploy/README.md, docs/db.md.
#   export CARHUNT_HOME=~/.carhunt     # after `cardb init` (creates $CARHUNT_HOME/cardb/ with the tokens file)
#   docker compose -f deploy/compose.yaml up -d --build cardb
#   carhunt secret exec cardb_web_tokens=CARHUNT_SECRET_CARDB_WEB_TOKENS -- docker compose -f deploy/compose.yaml up -d --build
name: carhunt

x-hardened: &hardened
  read_only: true                 # only /data (cardb) and tmpfs /tmp are writable
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  # Linux hosts: the bind-mounted data dir must be writable by this uid (chown, or CARHUNT_UID=$(id -u)).
  # Docker Desktop for macOS maps bind-mount ownership to the host user, so the default works there.
  user: "${CARHUNT_UID:-10001}:${CARHUNT_GID:-10001}"

services:
  cardb:
    <<: *hardened
    build:
      context: ../cardb
      args:
        VERSION: ${CARDB_VERSION:-dev}
    image: ${CARHUNT_CARDB_IMAGE:-carhunt/cardb:local}   # overridable so a test stack never retags or removes yours
    mem_limit: 768m
    environment:
      CARDB_DATA_DIR: /data
      CARDB_LISTEN: 0.0.0.0:8484
      CARDB_TOKENS_FILE: /data/tokens          # written by `cardb init` (name:sha256:<hex> lines; legacy name:token works)
      CARHUNT_CONFIG: /config/config.yaml      # owner/search/cardb sections → profile + users
    ports:
      - "127.0.0.1:${CARHUNT_CARDB_PORT:-8484}:8484"   # host port: CARHUNT_CARDB_PORT (a second stack, the e2e)
    volumes:
      - type: bind                             # SQLite (WAL) + photos/ + tokens: one dir = one backup path
        source: ${CARHUNT_HOME:?set CARHUNT_HOME}/cardb
        target: /data
      - type: bind
        source: ${CARHUNT_HOME:?set CARHUNT_HOME}/config.yaml
        target: /config/config.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "cardb", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  web:
    <<: *hardened
    build:
      context: ../web                          # Dockerfile owned by the web module
    image: ${CARHUNT_WEB_IMAGE:-carhunt/web:local}
    mem_limit: 384m
    depends_on:
      cardb:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "4321"
      NODE_ENV: production
      CARDB_URL: http://cardb:8484
      CARDB_WEB_TOKENS_FILE: /run/secrets/cardb_web_tokens   # name:token lines (owner + viewers); never sent to the browser
    secrets:
      - cardb_web_tokens
    ports:
      - "127.0.0.1:${CARHUNT_WEB_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4321/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

secrets:
  cardb_web_tokens:
    environment: CARHUNT_SECRET_CARDB_WEB_TOKENS   # inject with `carhunt secret exec` — never write it into a file here
