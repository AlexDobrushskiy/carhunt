     cue: "Premium audio brand", why: "'Canton' alone is also a place name in FR/LU/BE ads, so it needs an audio word next to it."}
  - {option: heat_pump, kind: text, implies: "yes",
     match: 'warmepumpe|pompe a chaleur|warmtepomp|bomba de calor|pompa di calore|heat ?pump|\br744\b|\b9m3\b|tepelne cerpadlo',
     cue: "Heat pump wording, R744, or PR code 9M3", why: "Explicit mention. Never infer it from a trim name."}
  - {option: hud, kind: text, implies: "yes",
