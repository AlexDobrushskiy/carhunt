fallback_ask: >-
  When the photos and text leave e-seats, tailgate, pano or audio unknown, ask the seller once for a photo of the
  vehicle data sticker ("Fahrzeugdatenträger"): a white label with the VIN, paint/interior codes and a block of
  3-character PR codes. On MEB cars it is in the boot, stuck to the metal under the boot floor panel (often the only
  copy; MEB has no paper service book, though some dealers stick a copy on the handover page of the owner's manual).
  A selling dealer can instead print the factory equipment list ("Fahrzeugdaten", PR list) from the VIN in a minute.
  Decode it for free by typing the codes into https://oemwolf.com/wiki/pr/?search=3FU+9M3+4E6 (space-separated codes,
  '+' in the URL; generic VAG meanings, so cross-check with pr_codes above). Optional second photo: the A/C refrigerant
  label under the bonnet (R744 = heat pump). Registration documents, the CoC and the infotainment carry no option
  list.
fallback_ask_i18n:
  en: "Could you please send a photo of the vehicle data sticker with the PR codes? It's a white label with the VIN and many 3-character codes, usually under the boot floor panel, sometimes in the owner's/service booklet. If you're a dealer, the factory equipment printout by VIN works too."
  de: "Könnten Sie mir bitte ein Foto des Fahrzeugdatenträgers mit den PR-Nummern schicken? Weißer Aufkleber mit FIN und vielen dreistelligen Codes, meist unter dem Kofferraumboden, manchmal in der Betriebsanleitung/im Serviceheft. Als Händler gerne auch den Fahrzeugdaten-Ausdruck (Ausstattung zur FIN)."
  fr: "Pourriez-vous m'envoyer une photo de l'étiquette des données du véhicule avec les codes PR ? Autocollant blanc avec le VIN et des codes à 3 caractères, en général sous le plancher du coffre, parfois dans la notice/le carnet. Pour un professionnel, la fiche d'équipement d'origine par VIN convient aussi."
  es: "¿Podría enviarme una foto de la etiqueta de datos del vehículo con los códigos PR? Es una pegatina blanca con el bastidor y muchos códigos de 3 caracteres, normalmente bajo el piso del maletero, a veces en el manual/libro de mantenimiento. Si es concesionario, también sirve el listado de equipamiento de fábrica por bastidor."
  nl: "Kunt u een foto sturen van de voertuiggegevenssticker met de PR-codes? Een witte sticker met het VIN en veel codes van 3 tekens, meestal onder de laadvloer van de kofferbak, soms in het instructie-/onderhoudsboekje. Als dealer mag ook de uitdraai van de fabrieksuitrusting op VIN."
  it: "Potrebbe inviarmi una foto dell'etichetta dati del veicolo con i codici PR? È un adesivo bianco con il telaio e molti codici di 3 caratteri, di solito sotto il piano del bagagliaio, a volte nel libretto d'uso/manutenzione. Se è un concessionario, va bene anche la stampa della dotazione di fabbrica da telaio."
  pt: "Pode enviar-me uma fotografia da etiqueta de dados do veículo com os códigos PR? É um autocolante branco com o VIN e muitos códigos de 3 caracteres, normalmente debaixo do piso da bagageira, às vezes no manual/livro de manutenção. Se for stand, também serve a listagem do equipamento de fábrica pelo VIN."

rules:
  - rule: "Interior photo cues beat everything, including a dealer's 'full' equipment list."
    why: "Dealer lists miss options (memory, pano, tailgate); a clear photo cue does not."
  - rule: "Silence is not a no: a missing option in photos or a short list stays unknown; only a long structured list that lacks it is a (weak) no."
    why: "Sellers rarely photograph the seat side, headliner, speaker logos or tailgate button."
  - rule: "On VW and Audi the wanted options are standalone packages, not trims; on Skoda the packages nest (Clever < Plus < Advanced < Maxx), so a visible trim cue carries seats + tailgate."
    why: "Most VW/Audi cars lack the packages whatever the trim; Skoda Sportline/lit grille implies them."
  - rule: "Exterior trim cues mostly fail for equipment: ignore Audi arch colour and S line badges for e-seats."
    why: "Contrast arch paint is standard on advanced and S line, body colour is a cheap option; e-seats need Komfortpaket plus on any trim."
  - rule: "Audi black textured arches = base exterior; use only as a reason to check options, never to rank or skip."
    why: "Most Audis lack e-seats anyway; well-equipped cars with unpainted bumpers exist."
  - rule: "VW arch cladding, privacy glass and a 'no light bar' front say nothing."
    why: "Arch cladding is black on every Pro; the light bar does not predict the e-tailgate."
  - rule: "VW black Bergen wheels do not mean pano."
    why: "Only ES Pro Black, FR Style Max and IT Style Pack carry pano; NL Limited Edition and DE BLACK EDITION use the same wheels without it."
  - rule: "VW separate headrests do not mean manual seats."
    why: "Interior Style Plus e-seats keep separate headrests."
  - rule: "A VW tailgate switch on the driver door card is not e-tailgate evidence; only the close button on the tailgate trim is."
    why: "The door switch also appears on manual-tailgate cars."
  - rule: "A lit front VW logo is aftermarket."
    why: "Not offered on ID.4/ID.5 in any DE/FR/IT/ES/LU/NL list."
  - rule: "Heat pump: never infer from a trim or package name; text, R744 label or PR code only."
    why: "Standalone option on every VW and Audi trim; standard on Skoda in some markets, optional in others."
  - rule: "11 kW AC is not a filter on these cars."
    why: "Standard on ID.4/ID.5 Pro, Q4 45 and Enyaq 85; only the Q4 35 had 7.2 kW."
  - rule: "Audi Q4 45 MY24+: don't score the e-tailgate, it is standard."
    why: "4E7 standard on all trims."
  - rule: "Audi MY27 cars: black arches and a frameless mirror are standard, so neither is a signal."
    why: "Standard equipment from MY27."
  - rule: "VW: an e-seat always means memory + massage (EU MY24+); HK always means AR-HUD and vice versa."
    why: "Interior Style Plus / Top-Sport Plus and Infotainment Plus bundles."
  - rule: "Enyaq Coupe always has a glass roof but no factory blind; an SUV pano comes with an electric blind."
    why: "Score accordingly if a blind matters."
  - rule: "Pre-facelift Skoda 'Plus' in an ad title is not evidence of the Plus package."
    why: "Pre-facelift titles use 'Plus' loosely."
  - rule: "Drive: read the ad title/text first (4Motion, quattro, AWD, 85x, Allrad, 4x4), variant rules second; check badges in photos."
    why: "Titles and badges can contradict a stored drive."
  - rule: "A site body category 'SUV / 4x4' is not a drive assertion."
    why: "FR sites label every SUV 'SUV 4x4'; the drive rules strip it before matching."
  - rule: "Trust stated power over registration year around the MY24 switch."
    why: "Late-2023 regs can be either 204 or 286 hp. A rotary drive selector on the VW cockpit pod = pre-MY24 150 kW car."
  - rule: "Fetch the full photo gallery before judging options."
    why: "The DB often holds only the cover photo; the seat-side check needs the gallery."
  - rule: "Seller-entered site tags are noisy; prefer ad prose and photos."
    why: "Marketplace 'panorama roof' and 'electric seat' tags are inflated (sunroof or display counted as pano)."
  - rule: "20in/21in wheels are a small comfort minus, and a weak 'options ticked' signal."
    why: "All 20-21in Q4 wheels are staggered; big VW wheels are a paid option."
  - rule: "UK (RHD) ads use different trim/package names (e.g. Audi 'Comfort Pack', Skoda 'SE L/Edition'); map with care or skip."
    why: "The cues here are for LHD EU markets."
