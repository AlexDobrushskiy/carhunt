# Model heuristics plug-in: VW-group MEB EVs (VW ID.4/ID.5, Skoda Enyaq/Enyaq Coupe, Audi Q4/Q4 Sportback, Cupra Tavascan)
#
# Conventions
# - Every `match`/`unless` regex is Python `re`, applied to ASCII-folded lowercase text
#   (NFKD, accents stripped: "Wärmepumpe" -> "warmepumpe", "Coupé" -> "coupe", "más" -> "mas").
# - families, variants, drive_rules: ordered, first match wins (variants: first match per family).
# - `family` may be a single name or a list of names from `families`.
# - `unless`: skip the rule if this regex matches the same text (variants/drive) or the clause around the
#   match (option_cues; a clause = text between . ; or newline).
# - `power_kw_min` / `power_kw_max` (variants): rule applies on the ad's stated power when no text rule hit.
# - A 2023 registration can be either side of the MY24 286 hp switch: trust stated power over year.

plugin: vag_meb
version: 1
scope_note: "Most detailed for the 286 hp (210 kW) RWD versions: ID.4/ID.5 Pro MY24+, Q4/Q4 Sportback 45 MY24+, Enyaq/Enyaq Coupe 85 MY24+."

families:
  "VW ID.4":              {make: Volkswagen, match: '\bid\.?\s?4(?!\d)'}
  "VW ID.5":              {make: Volkswagen, match: '\bid\.?\s?5(?!\d)'}
  "Audi Q4 Sportback e-tron": {make: Audi, match: '\bq4\b.*\bsportback\b|\bsportback\b.*\bq4\b'}
  "Audi Q4 e-tron":       {make: Audi, match: '\bq4\b'}
  "Skoda Enyaq Coupe":    {make: Skoda, match: '\benyaq\b.*\bcoupe\b|\bcoupe\b.*\benyaq\b'}
  "Skoda Enyaq":          {make: Skoda, match: '\benyaq\b'}
  "Cupra Tavascan":       {make: Cupra, match: '\btavascan\b'}

variants:
  # --- VW ID.4 / ID.5 ---
  - {family: ["VW ID.4", "VW ID.5"], match: '\bpure\b|\b5[25]\s?kwh?\b', battery_net_kwh: 52,
     note: "Pure, 52 kWh net (109/125 kW). Out of the 77 kWh class."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\bgtx\b', battery_net_kwh: 77, drive: awd,
     note: "GTX, dual motor AWD. FR/IT/LU MY26-27 lists show 79 kWh on the GTX."}
  - {family: ["VW ID.4", "VW ID.5"], match: '4\s?motion', battery_net_kwh: 77, drive: awd,
     note: "Pro 4MOTION = AWD; never treat as the RWD Pro."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\b79([.,]\d)?\s?kwh\b', year_from: 2026, battery_net_kwh: 79, drive: rwd,
     note: "79 kWh Pro = MY27 at the earliest; most markets keep the Pro at 77."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\bpro\b|\b77([.,]\d)?\s?kwh\b|\b77\b', year_from: 2024, battery_net_kwh: 77, power_kw: 210, drive: rwd,
     note: "MY24+ Pro: APP550 210 kW (286 hp), 12.9in screen, drive selector stalk on the column."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\bpro\b|pro ?perf|\b77([.,]\d)?\s?kwh\b|\b77\b', year_to: 2023, battery_net_kwh: 77, power_kw: 150, drive: rwd,
     note: "MY21-23 Pro / Pro Performance 150 kW (204 hp). Late-2023 regs can be MY24 210 kW: trust stated power. A rotary selector on the cockpit pod = pre-MY24."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\bpro\b|pro ?perf|\b77([.,]\d)?\s?kwh\b|\b77\b', battery_net_kwh: 77, drive: rwd,
     note: "Year unknown: 77 kWh RWD; power 150 or 210 kW, check stated power."}
  - {family: ["VW ID.4", "VW ID.5"], match: '', power_kw_min: 128, battery_net_kwh: 77,
     note: "Power fallback: >= 128 kW is a 77 kWh car."}
  - {family: ["VW ID.4", "VW ID.5"], match: '', power_kw_max: 127, battery_net_kwh: 52,
     note: "Power fallback: < 128 kW = Pure."}

  # --- Audi Q4 / Q4 Sportback ---
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b35\b|35\s?e-?tron|e-?tron\s?35|\b5[25]\s?kwh', battery_net_kwh: 52, drive: rwd,
     note: "Q4 35, 52 kWh net, 7.2 kW AC (KB2)."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b50\b|50\s?e-?tron|e-?tron\s?50', battery_net_kwh: 77, drive: awd,
     note: "Q4 50 quattro, AWD."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '(\b45\b|45\s?e-?tron|e-?tron\s?45).*quattro|quattro.*(\b45\b|45\s?e-?tron|e-?tron\s?45)', battery_net_kwh: 77, drive: awd,
     note: "Q4 45 quattro, AWD (not the 286 hp RWD car)."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b45\b|45\s?e-?tron|e-?tron\s?45', year_from: 2024, battery_net_kwh: 77, power_kw: 210, drive: rwd,
     unless: 'quattro',
     note: "MY24+ Q4 45: 210 kW (286 hp) RWD, 77 kWh, 11 kW AC, e-tailgate standard."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b45\b|45\s?e-?tron|e-?tron\s?45', battery_net_kwh: 77, drive: rwd,
     unless: 'quattro',
     note: "Q4 45 with unknown or 2023 year: 77 kWh; 2023 regs can be MY24 210 kW, check stated power."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b40\b|40\s?e-?tron|e-?tron\s?40', year_from: 2025, battery_net_kwh: 63, drive: rwd,
     unless: '\b7[67]([.,]\d)?\s?kwh|\b82\s?kwh',
     note: "2025+ Q4 40 = 63 kWh. If the ad states 76/77/82 kWh, fall through to the 77 kWh rule."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b40\b|40\s?e-?tron|e-?tron\s?40|\b7[67]([.,]\d)?\s?kwh|\b82\s?kwh', battery_net_kwh: 77, power_kw: 150, drive: rwd,
     note: "Pre-2025 Q4 40, 77 kWh, 150 kW (204 hp)."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '', power_kw_max: 125, battery_net_kwh: 52,
     note: "Power fallback: <= 125 kW = Q4 35."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '', power_kw_min: 150, battery_net_kwh: 77,
     note: "Power fallback: >= 150 kW = 77 kWh pack (except 2025+ Q4 40, see above)."}

  # --- Skoda Enyaq / Enyaq Coupe ---
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b50\b|iv\s?50|\b5[25]\s?kwh', unless: '\b8[05]\s?x?\b|\brs\b|\b77\s?kwh|\b82\s?kwh', battery_net_kwh: 52,
     note: "Enyaq 50: 52 kWh net."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b(55|58|60|62)\b|iv\s?60|\b5[8]\s?kwh|\b62\s?kwh', unless: '\b8[05]\s?x?\b|\brs\b|\b77\s?kwh|\b82\s?kwh', battery_net_kwh: 58,
     note: "Enyaq 60: 58 kWh net."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b8[05]\s?x\b|iv\s?80\s?x|\brs\b', battery_net_kwh: 77, drive: awd,
     note: "85x / 80x / RS = AWD."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b85\b', battery_net_kwh: 77, power_kw: 210, drive: rwd,
     note: "Enyaq 85: 210 kW (286 hp) RWD, from ~12/2023."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b80\b|iv\s?80', battery_net_kwh: 77, power_kw: 150, drive: rwd,
     note: "Enyaq iV 80 (MY21-23): 150 kW (204 hp) RWD."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b7[77]\s?kwh|\b82\s?kwh', battery_net_kwh: 77,
     note: "Stated 77/82 kWh."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '', power_kw_min: 150, battery_net_kwh: 77,
     note: "Power fallback: >= 150 kW = 80/85."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '', power_kw_max: 149, battery_net_kwh: 58,
     note: "Power fallback: < 150 kW = Enyaq 60 class."}

  # --- Cupra Tavascan ---
  - {family: "Cupra Tavascan", match: '\bendurance\b', battery_net_kwh: 77, power_kw: 210, drive: rwd,
     note: "Endurance = 286 hp RWD, 77 kWh net."}
  - {family: "Cupra Tavascan", match: '\bvz\b', battery_net_kwh: 77, drive: awd,
     note: "VZ = dual motor AWD, 77 kWh net."}

drive_rules:
  # on: variant (default) = model + variant (+ title); on: ad_text = title + description + drive fields.
  # Evaluate ad_text rules first; then variant rules. Collect every hit per pass; exactly one distinct drive = decisive,
  # more = unknown. A `stop` rule ends its pass with unknown.
  - {match: '\b(?:not|no|non|without|ohne|kein)\b|\?|\b(?:awd|rwd|fwd)\s*[/|]\s*(?:awd|rwd|fwd)\b', drive: null, stop: true,
     why: "A variant that negates a drive or lists alternatives is not decisive."}
  - {match: '\b(?:4matic|quattro|xdrive\s*\d*|awd|4motion|gtx|dual[ -]motor)\b', drive: awd,
     why: "Explicit AWD markers."}
  - {match: '\brwd\b', drive: rwd, why: "Explicit."}
  - {match: '\bfwd\b', drive: fwd, why: "Explicit."}
  - {family: ["VW ID.4", "VW ID.5"], match: '\bpro\b', unless: '\b(?:4matic|quattro|xdrive|awd|4\s?motion|gtx|dual[ -]motor)\b', drive: rwd,
     why: "Pro without an AWD marker is the single-motor RWD car; Pro 4MOTION is AWD."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b40\b', drive: rwd,
     why: "Q4 40 is single-motor RWD."}
  - {family: "Cupra Tavascan", match: '\bendurance\b', drive: rwd, why: "Endurance = single motor RWD."}
  - {family: "Cupra Tavascan", match: '\bvz\b', drive: awd, why: "VZ = dual motor AWD."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b8[05]\s?x\b|\brs\b', drive: awd,
     why: "x suffix / RS = dual motor AWD."}
  - {family: ["Skoda Enyaq", "Skoda Enyaq Coupe"], match: '\b8[05]\b(?!\s?x)', unless: '\b8[05]\s?x\b|\brs\b|4x4|allrad|awd', drive: rwd,
     why: "Enyaq 80/85 without x = single motor RWD."}
  - {family: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"], match: '\b45\b', unless: 'quattro|awd|allrad', drive: rwd,
     why: "MY24+ Q4 45 without quattro = 210 kW RWD (pre-MY24 45 was quattro only; check year)."}
  # Ad title/prose markers (read these BEFORE the variant rules):
  - {on: ad_text, match: '\ballrad\b|\b8[05]\s?x\b|\b4wd\b|\b4\s?motion\b|\bquattro\b|transmission integrale|traccion total|tracao integral|trazione integrale|vierwielaandrijving', drive: awd,
     why: "Ad-text AWD markers."}
  - {on: ad_text, match: '\b4\s?x\s?4\b', drive: awd,
     unless: 'type de vehicule\s*:\s*suv\s*4x4|\bsuv\s*/\s*4x4\b|\bsuv[ -]4x4\b|gelandewagen\s*/\s*pick-?up',
     why: "'4x4' counts only outside a site body category: 'SUV / 4x4' is not a drive assertion."}

option_cues:
  # ---------------- Direct photo cues (all families) ----------------
  - {option: electric_seats, kind: photo, implies: "yes",
     cue: "Switch panel on the outboard side of the seat base (slide/height rocker + backrest switch)",
     why: "Direct; beats ad text."}
  - {option: electric_seats, kind: photo, implies: "no",
     cue: "Height pump lever + recline lever or handwheel on the seat side",
     why: "Direct. Check both seats: Skoda Plus electrifies the driver seat only."}
  - {option: memory_seats, kind: photo, implies: "yes",
     cue: "Memory buttons (1/2/3 or M/SET): VW + Skoda on the driver seat side, Audi on the driver door card",
     why: "Direct; dealer lists often omit memory."}
  - {option: power_tailgate, kind: photo, implies: "yes",
     cue: "Close button on the inner trim of the open tailgate",
     why: "Direct. Rarely photographed. Retrofit kits exist."}
  - {option: pano, kind: photo, implies: "yes",
     cue: "Glass roof seen from inside (blind cover/rails, roof-blind switch in the overhead console)",
     why: "Direct. From outside it usually hides under a black contrast roof (VW)."}
  - {option: pano, kind: photo, implies: "no",
     cue: "Solid fabric headliner seen from inside",
     why: "Direct."}
  - {option: premium_audio, kind: photo, implies: "yes",
     cue: "harman/kardon, SONOS or CANTON logo on a door/A-pillar speaker grille",
     why: "Direct. HK = VW, Sonos = Audi, Canton = Skoda."}
  - {option: premium_audio, kind: photo, implies: "no",
     cue: "Plain speaker grille (no brand logo) in a clear close-up",
     why: "Direct."}
  - {option: heat_pump, kind: photo, implies: "yes",
     cue: "A/C refrigerant label under the bonnet reads R744",
     why: "R744 (CO2) circuit = heat pump; R1234yf = none. Heat pump has no other visible cue. A workshop refill with the wrong gas can mislead."}
  - {option: heat_pump, kind: photo, implies: "no",
     cue: "A/C refrigerant label under the bonnet reads R1234yf",
     why: "Same label, other value."}
  - {option: towbar, kind: photo, implies: "yes",
     cue: "Towbar ball or socket visible under the rear bumper",
     why: "Direct."}

  # ---------------- VW ID.4 / ID.5 ----------------
  - {option: electric_seats, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "ergoActive strip on the seat side (massage button + 1/2/SET)",
     why: "VW EU MY24+ e-seats come only as Interior Style Plus or Top-Sport Plus, always with memory + massage."}
  - {option: memory_seats, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "ergoActive strip on the seat side (massage button + 1/2/SET)", why: "As above: no VW e-seat without memory."}
  - {option: massage_seats, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "ergoActive strip on the seat side (massage button + 1/2/SET)", why: "As above: ergoActive includes pneumatic massage."}
  - {option: electric_seats, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "Top-Sport seat (one-piece back) with a gloss-black cut-out slot in the headrest and a dotted ID. logo, on a non-GTX",
     why: "Top-Sport Plus = e-seats + memory + massage. Coding 'one-piece seat' alone scored 4/9: standard ArtVelours seats also look one-piece; the cut-out slot separates them."}
  - {option: electric_seats, kind: photo, implies: "no", families: ["VW ID.4", "VW ID.5"],
     cue: "Plain cloth upholstery (no leatherette/microfibre)",
     why: "Non-leather/microfibre interiors come without e-seats."}
  - {option: matrix_led, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "Thin LED light bar between the headlights (unlit: translucent strip, not a solid gloss-black panel)",
     why: "Light bar = Design pack = Matrix IQ.Light + 3D tail lights with dynamic indicators."}
  - {option: power_tailgate, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "Front LED light bar (Design pack), ad outside DE",
     why: "Weak lift: base rate was 22/31. Design-pack trims (FR Life Max, IT Edition Plus, ES Pro Mas, BE Pro Business, NL LE Plus) carry the e-tailgate; DE cars often don't."}
  - {option: camera_360, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "Cameras under the door mirrors / Area View on the screen", why: "Assistance Plus / IQ.DRIVE."}
  - {option: power_tailgate, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "360 camera (mirror cameras / Area View) on a MY24-26 car",
     why: "MY24-26 IQ.DRIVE / Assistance Plus bundles the e-tailgate. Not DE MY27 (moved to a luggage package)."}
  - {option: adaptive_cruise, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "360 camera (mirror cameras / Area View) on a MY24-26 car", why: "Same package carries Travel Assist (includes ACC)."}
  - {option: hud, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "AR-HUD image or rectangular HUD aperture on the dash top", why: "Infotainment Plus."}
  - {option: premium_audio, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "AR-HUD image or rectangular HUD aperture on the dash top", why: "Infotainment Plus = HK + AR-HUD always together."}
  - {option: hud, kind: photo, implies: "yes", families: ["VW ID.4", "VW ID.5"],
     cue: "harman/kardon grille logo", why: "Infotainment Plus = HK + AR-HUD always together."}
  - {option: power_tailgate, kind: photo, implies: "no", families: ["VW ID.4", "VW ID.5"],
     cue: "19in steel wheels with full plastic covers (no visible lug nuts)",
     why: "Bare Pro (DE/IT/LU base, FR ID./Life, ES pre-06/24, PT City). Winter sets can fake it; ID.5 always has alloys."}
  - {option: electric_seats, kind: photo, implies: "no", families: ["VW ID.4", "VW ID.5"],
     cue: "19in steel wheels with full plastic covers", why: "Bare car."}

  # ---------------- Audi Q4 ----------------
  - {option: electric_seats, kind: photo, implies: "no", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Interior mirror with a frame and a manual tilt tab (MY24-26)",
     why: "No Komfortpaket (frameless auto-dim mirror comes with PYA/PYY), so no PYY e-seats. MY27: frameless is standard, no signal."}
  - {option: pano, kind: photo, implies: "yes", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Gloss-black roof panel on a light-coloured car",
     why: "Audi has no contrast-roof option; the pano roof is the gloss-black roof. Dark paint hides it."}
  - {option: matrix_led, kind: photo, implies: "yes", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Lit full-width rear light bar + two reversing lights; or headlight-washer covers in the bumper (DE MY24-26)",
     why: "Matrix package PXC. NL has Matrix standard from Advanced edition and sold washers separately."}
  - {option: camera_360, kind: photo, implies: "yes", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Cameras under the mirrors + front grille camera", why: "PZC (MY24-26) / Tech plus-pro (MY27)."}
  - {option: hud, kind: photo, implies: "yes", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Large AR-HUD projector recess on the dash top", why: "MMI Navigation pro (PYH) MY24-26; separate KS3 on MY27."}
  - {option: electric_seats, kind: photo, implies: "no", families: ["Audi Q4 e-tron", "Audi Q4 Sportback e-tron"],
     cue: "Textured unpainted black plastic arches and bottom line (MY24-26)",
     why: "Base exterior. Adds little: most Audis lack e-seats anyway. Never rank or skip on it alone."}

  # ---------------- Skoda Enyaq ----------------
  - {option: electric_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Sportline: black mirrors, gloss-black rails and window trim, Sportline badges, sport seats with integrated headrests",
     why: "Sportline carries Plus content: driver e-seat with memory (passenger manual unless Maxx)."}
  - {option: memory_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Sportline exterior or lit grille", why: "Plus content: driver e-seat memory."}
  - {option: power_tailgate, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Sportline exterior or lit grille", why: "Plus/Clever content (nested packages)."}
  - {option: electric_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Pre-facelift lit Crystal Face grille (translucent ribs + light strip) or facelift lit Tech-Deck light bar",
     why: "Advanced package, which includes Plus."}
  - {option: hud, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Lit grille (Crystal Face / Tech-Deck) or HUD projector opening on the dash top", why: "Advanced package."}
  - {option: premium_audio, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Lit grille (Crystal Face / Tech-Deck)", why: "Advanced package includes Canton."}
  - {option: electric_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Pre-facelift L&K: L&K fender badges, Platinum Grey bumper/diffuser/mirror caps, chrome-framed Crystal Face",
     why: "L&K pre-facelift = both front e-seats with memory + massage + ventilation, e-tailgate, Canton, HUD, Matrix; pano still optional. Facelift DE 'L&K' is only an interior pack."}
  - {option: ventilated_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Pre-facelift L&K exterior, or perforated ventilated leather", why: "L&K std; facelift Maxx with ventilation (Suite/ecoSuite only)."}
  - {option: electric_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "3-spoke steering wheel on a non-Sportline, non-RS car (base cars have 2-spoke)",
     why: "Maxx package = both front e-seats with memory, DCC. L&K keeps a 2-spoke wheel but has e-seats anyway."}
  - {option: electric_seats, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Front camera in the grille on a pre-facelift car", why: "Pre-facelift Area View sits in Maxx (both e-seats)."}
  - {option: power_tailgate, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Headlamp-washer caps (pre-facelift, or facelift MY25)", why: "Plus package. Dropped from the DE MY26 Plus list."}
  - {option: power_tailgate, kind: photo, implies: "yes", families: ["Skoda Enyaq"],
     cue: "Rear-door pull-up sun blinds on a facelift car", why: "Facelift Plus (DE/FR). Standard on all pre-facelift CH cars, so no signal there."}
  - {option: matrix_led, kind: photo, implies: "yes", families: ["Skoda Enyaq", "Skoda Enyaq Coupe"],
     cue: "Dynamic (animated) rear indicators; Sportline; lit grille", why: "Matrix comes in Plus."}

  # ---------------- Text cues: generic option words (DE/FR/NL/ES/PT/IT/EN) ----------------
  - {option: electric_seats, kind: text, implies: "yes",
     match: '(vorder|fahrer)?sitze?\w*[^.;\n]{0,25}elektr|elektr\w*[^.;\n]{0,20}(vorder|fahrer)?sitz|electric(ally)?( adjustable| power)?( front| driver)? seats?|power seats?|sieges?( avant| conducteur)?[^.;\n]{0,15}electriq|elektrisch verstelbare? (voor|bestuurders)?stoel|asientos?[^.;\n]{0,20}electric|bancos?[^.;\n]{0,20}ele(c)?tric|sedil[ei][^.;\n]{0,20}elettric|ergoactive plus|top-?sport plus|interior style plus|komfortpaket plus|comfortpakket plus',
     unless: 'lumb|lenden|lordos|lombair|lendensteun',
     cue: "Explicit electric-seat wording",
     why: "Only an explicit mention counts. Electric lumbar alone is not e-seats; 'ergoActive' or 'comfort seats' alone are not either."}
  - {option: memory_seats, kind: text, implies: "yes",
     match: '\bmemory\b|memoria|memoire|geheugen|\bmemorie\b|speicherfunktion|memory-funktion',
     unless: 'park|einpark|stationnement|aparcamiento|estacionamento|parcheggio|parkeer',
     cue: "Seat memory wording", why: "VW 'memory parking' (IQ.DRIVE) is not seat memory."}
  - {option: power_tailgate, kind: text, implies: "yes",
     match: '(heckklappe|gepackraumklappe|kofferraumklappe)[^.;\n]{0,30}elektr|elektr\w*[^.;\n]{0,15}(heckklappe|gepackraumklappe|kofferraum|achterklep|kofferklep)|hayon[^.;\n]{0,20}(electrique|motorise)|porton[^.;\n]{0,20}electric|portellone[^.;\n]{0,20}elettric|(porta|portao|tampa) (da |de )?bagageira[^.;\n]{0,15}ele(c)?tric|(power|electric)[^.;\n]{0,10}(tailgate|boot ?lid|liftgate)|easy open (&|and|und|et|e|y) close|virtual pedal|komfortoffnung',
     cue: "Electric tailgate wording", why: "Explicit mention."}
  - {option: pano, kind: text, implies: "yes",
