fuel:         # cardb powertrain → fuelTypeId (page Fueltype2List / gateway fuelTypeIds)
  diesel: 1
  petrol: 2
  bev: 3
  hev: 4
  phev: 5
fuel_names: {1: Diésel, 2: Gasolina, 3: Eléctrico, 4: Híbrido, 5: Híbrido enchufable, 6: GLP, 7: GNC, 8: Otros}
seller:       # page `st` / gateway sellerTypeId (0 = any)
  dealer: 1
  private: 2
drive: {1: all, 3: front, 4: rear}               # drivenWheelsId (bundle: SEARCH_BOX_SELECT_DRIVEN_WHEELS_*)
gearbox: {1: automatic, 2: manual}               # transmissionTypeId
sort:         # page: no fi/or = the site's default "relevance" (newest first after promoted rows); no creation-date sort exists
  newest: {page: {}, gateway: {term: relevance, order: desc}}
  relevance: {page: {}, gateway: {term: relevance, order: desc}}
  price: {page: {fi: Price, or: "1"}, gateway: {term: price, order: asc}}
category1: 2500                                  # second-hand cars (Section1Id / categories.category1Ids)
offer_types: [0, 2, 3, 4, 5]                     # gateway offerTypeIds the site's app sends for second-hand
page_size: 30                                    # gateway pagination.size (the page route serves 35)
