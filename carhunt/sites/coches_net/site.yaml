site: coches.net
name: coches.net
kind: marketplace
countries: [ES]
hosts: ['(^|\.)coches\.net$']
ad_id: ['-(\d{6,})-[a-z]{4}\.aspx']
wall: Imperva ABP (reese84) via CloudFront
route: http
country_ip: null
accept_language: "es-ES,es;q=0.9"
pace:
  min_gap_s: 12
  max_loads_per_run: 60
  max_loads_per_hour: 2
  why: >-
    page loads (kind load): ≤2 per rolling hour shared by every agent on the IP, also via the ES proxy. Gateway JSON
    reads (kind api, ES IP): ≥12 s apart, ≤60 per run
account:
  needed_for: [message]
  verification: email-link
  note: "email account, email link; the profile form takes only a Spanish mobile + Spanish postcode — don't fake them"
  mail_from: "from:(coches.net)"
phone: reveal
messaging: "logged in, Spanish residential IP, non-Playwright browser: 'Contactar' once → contact-mail 2xx; never Enter in the box (resets the form)"
liveness:
  proxy_country: ES
  gone_redirect: '/segunda-mano/'
  evidence: >-
    302 to a model list page (/<make>/<model>/segunda-mano/ or /segunda-mano/) = the site's own "ad gone" (Imperva
    never redirects); 200 + ad id = live; km-0 pages sometimes 200 without the id → unknown
proxy: {sticky_minutes: 30}
cursor: {strategy: full, why: "no creation-date sort; relevance order with promoted rows first → cover every page"}
measured: 2026-11-07
notes:
  - "Never open coches.net in a Playwright-attached browser: Imperva sees the CDP domains and flags every agent browser on the IP for hours"
  - "Contact and phone APIs answer 403 to every non-Spanish IP, whatever the client; a Spanish residential IP passes"
  - "Free VPNs and datacenter exits get the bot page on the first load"
  - "Gateway search body: send the full filter set the site's app sends (a short body gets 400)"
  - "No creation-date sort exists: the default order is relevance (promoted rows first) → a sweep covers every page"
  - "A 'not sent' contact can still arrive (aborted XHR delivered): check relay mail before any re-send"
