site: wallapop.com
name: Wallapop
kind: marketplace
countries: [ES]
hosts: ['(^|\.)wallapop\.com$']
ad_id: ['/item/[^/?#]*?-(\d{6,})(?=[/?#]|$)']
wall: none (public JSON API on CloudFront)
route: http
country_ip: null
accept_language: "es-ES,es;q=0.9"
pace:
  min_gap_s: 5
  max_loads_per_run: 60
  read_after: "12:00"
  why: "≥5 s. ≤60/run + reads after 12:00 (or via a proxy): agents chat with sellers here and read bursts can get the home IP 403'd"
caps: {}
account:
  needed_for: [message]
  verification: email-code
  note: "email + password (Keycloak, invisible reCAPTCHA passes in a plain Chrome); new-device login = email code"
  mail_from: "from:(wallapop.com)"
phone: page
messaging: "logged-in site chat es.wallapop.com/app/chat?itemId=<hash id>; ≤300 chars per message (longer text is cut silently)"
liveness:
  sold_text: '"flags":\{[^}]*"sold":true'
  evidence: "page 404 = gone; 200 + legacy id = live; sold flag in the page JSON = gone"
cursor: {strategy: newest_id, why: "order_by=newest; bumped rows are older → never a cursor"}
measured: 2026-11-06
notes:
  - "Private sellers have no phone (chat only); professionals carry extra_info.phone_number in the public user API"
  - "Item attribute engine=electric_hybrid means battery-electric (site quirk); hybride_plugin = PHEV"
  - "Search is keyword + geo-sorted from lat/lon (default Madrid); 40 rows/page, next_page token"
  - "Bumped rows (bump.type city/country) sit outside the newest order: never a cursor"
  - "A sold flag in search/API JSON is not a liveness verdict: only is_live decides"
