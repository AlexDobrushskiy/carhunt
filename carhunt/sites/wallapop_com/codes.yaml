# Wallapop public API: GET https://api.wallapop.com/api/v3/search?category_id=100&keywords=<text>&latitude&longitude
#   &order_by=newest&source=search_box[&seller_type&min_year&max_km&min_sale_price&max_sale_price]; then ?next_page=<token>
api: https://api.wallapop.com/api/v3
web: https://es.wallapop.com
category: 100            # cars
geo: {latitude: "40.4168", longitude: "-3.7038"}   # search origin (Madrid): results are geo-sorted from it
seller:                  # seller_type
  private: private
  dealer: professional
sort:                    # order_by
  newest: newest
  price: price_low_to_high
  relevance: most_relevance
engine:                  # item attribute `engine` code → fuel label (others kept as given)
  electric_hybrid: electric      # site quirk: battery-electric, not a hybrid
  hybride_plugin: plug-in hybrid
keywords:                # search text per make/model (missing → "<make> <model>")
  Volkswagen: {ID.4: ID.4, ID.5: ID.5, ID.3: ID.3}
  Audi: {Q4 e-tron: Q4 e-tron}
  Skoda: {Enyaq: Enyaq}
  BMW: {iX1: iX1}
  Hyundai: {Ioniq 5: Ioniq 5}
  Toyota: {bZ4X: bZ4X}
  Mercedes-Benz: {EQA: EQA, EQB: EQB}
  Kia: {EV6: EV6}
  Cupra: {Tavascan: Tavascan}
  MINI: {Countryman: Countryman}
  Xpeng: {G6: Xpeng G6}
  BYD: {Seal U: BYD Seal U, Sealion 7: BYD Sealion 7}
