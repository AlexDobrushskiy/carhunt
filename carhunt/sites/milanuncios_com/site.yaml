site: milanuncios.com
name: milanuncios
kind: marketplace
countries: [ES]
hosts: ['(^|\.)milanuncios\.com$']
ad_id: ['-(\d{6,})\.htm']
wall: Imperva ABP (reese84)
route: plain-chrome
country_ip: null
tab_home: "https://www.milanuncios.com/"
accept_language: "es-ES,es;q=0.9"
pace:
  min_gap_s: 8
  max_loads_per_run: 60
  why: >-
    15 list pages at 6.5 s + ~12 other loads in one tab, no block (11-01); daily sweeps at 8 s with a 60-load run
    allowance (11-04..07), no block; curl gets the challenge page, any real Chrome passes on the first load
caps:
  phone_per_session: 3
  phone_per_day: 9
  why: >-
    the 4th 'Llamar' in one session got 403 twice (11-03), ES IP or not → new sticky ES session after 3; ≤9/day in
    total (owner's rule 11-05); a slot is taken before the click (a 403 counts)
account:
  needed_for: [phone, message]
  verification: email-link
  note: "email + password, email link (11-01); no buyer phone verification (phoneRequired NONE)"
  mail_from: "from:(milanuncios.com)"
phone: reveal-login
messaging: "logged in + Spanish IP, media on: 'Mensaje' → 'Escribir otro mensaje' → 'Enviar' once → chat/contact 200 (11-03)"
liveness:
  mode: fetch
  evidence: >-
    redirect to a list page (?marca=…) = soft gone (49 checks 11-04..07); 200 + ad id = live; 404/410 = gone
proxy: {sticky_minutes: 30}
cursor: {strategy: newest_id, why: "orden=date; ad ids grow with time"}
measured: 2026-11-07
notes:
  - "Reads: one plain-chrome tab on the home page, then same-origin fetches of the server-rendered pages (window.__INITIAL_PROPS__): one request per page"
  - "Phone endpoint (contact.gw…/v1/classifieds/<id>/phone) answers 403 'Navegas desde fuera de España' to any non-Spanish IP, logged in or not (11-01)"
  - "Phones are not in the page data; 'Llamar' only shows when contactMethods.phone is true (else messages only)"
  - "Registration dates are year-only"
