# milanuncios.com list URL: https://www.milanuncios.com/<make slug>-de-segunda-mano/?s=<keyword>&<filters>&pagina=N
# The site has no model filter in the URL: the model is a keyword (`s`) matched against the title → discover scopes.
makes:        # path slug; missing → slugify(make). `coches` = no make category on the site: the make joins the keyword
  Mercedes-Benz: mercedes-benz
  XPeng: coches
models:       # keyword `s` (as the sweeps sent it, 11-04..07); missing → the model name lowercased
  Volkswagen: {ID.3: id.3, ID.4: id.4, ID.5: id.5}
  Audi: {Q4 e-tron: q4}
  Skoda: {Enyaq: enyaq}
  Hyundai: {Ioniq 5: ioniq 5}
  Kia: {EV6: ev6}
  XPeng: {G6: g6}
  Cupra: {Tavascan: tavascan}
  Mercedes-Benz: {EQA: eqa, EQB: eqb}
  BMW: {iX1: ix1}
  Toyota: {bZ4X: bz4x}
  Mini: {Countryman: countryman}
  BYD: {Seal U: seal u, Sealion 7: sealion 7}
params:       # SearchQuery field → URL key. desde/anoh follow the site's scheme but were not sent in the measured runs
  year_min: anod
  year_max: anoh
  km_max: kilometersTo
  price_min: desde
  price_max: hasta
fuel:         # `fuels` (others: leave unfiltered)
  bev: electrico
seller:       # `vendedor`
  private: part
  dealer: prof
sort:         # `orden`; relevance/price = the site's default order (no orden)
  newest: date
max_pages: 200      # the site serves at most 200 pages (10,000 ads) per query
