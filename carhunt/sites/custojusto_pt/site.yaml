site: custojusto.pt
name: CustoJusto
kind: marketplace
countries: [PT]
hosts: ['(^|\.)custojusto\.pt$']
ad_id: ['-(\d{6,})(?:[?#]|$)']
wall: client-fingerprint 403 (plain HTTP clients blocked; the same IP passes in a real browser)
route: lane
tab_home: https://www.custojusto.pt/
country_ip: null
accept_language: "pt-PT,pt;q=0.9"
pace:
  min_gap_s: 13
  why: "browser reads at ≥13 s; plain HTTP gets 403"
caps:
  phone_per_day: 0
  why: "phone POST /api/ad/phone 403s even from the ad page in a real browser → contact form"
account:
  needed_for: [message]
  verification: email
  note: "email login; profile clones may lack the session: check login first"
  mail_from: "from:(custojusto.pt)"
phone: none
messaging: "'Enviar mensagem' = contact form (one-way); the seller's reply opens a thread in the CJ inbox"
liveness:
  mode: fetch
  gone_redirect: '[?&]gone=\d+'
  evidence: "redirect to the list with ?gone=<id> = gone; 200 + id = live (in-tab fetch)"
cursor: {strategy: newest_id, why: "default order is newest first; numeric ids grow"}
measured: 2026-11-07
notes:
  - "Plain HTTP gets 403 for hours while a browser on the same IP loads pages: read in a browser tab, stop at the first 403"
  - "km is shown only as a range (base.mileage): RawAd.km stays empty, extra.km_range/km_min/km_max carry it — ask the seller for the cluster photo"
